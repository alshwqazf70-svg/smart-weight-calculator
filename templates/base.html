<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚖️ حاسبة وزن الحديد الذكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="main-header">
        <div class="container">
            <h1 class="app-title">⚖️ حاسبة وزن الحديد الذكية</h1>
            <nav class="main-nav">
                <a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}">الحاسبة</a>
                <a href="{{ url_for('history') }}" class="nav-link {% if request.path == '/history' %}active{% endif %}">السجل</a>
                {% if session.get('admin_logged_in') %}
                <a href="{{ url_for('admin') }}" class="nav-link {% if request.path == '/admin' %}active{% endif %}">الإدارة</a>
                <a href="{{ url_for('logout') }}" class="nav-link">خروج</a>
                {% else %}
                <a href="{{ url_for('login') }}" class="nav-link">الإدارة</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="main-footer">
        <p>⚖️ حاسبة وزن الحديد الذكية &copy; 2024</p>
    </footer>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
