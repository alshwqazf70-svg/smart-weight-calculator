{% extends "base.html" %}

{% block title %}{{ app_name }} - دخول الإدارة{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="display-4 mb-2">🔒</div>
                    <h3 class="fw-bold">صفحة الإدارة</h3>
                    <p class="text-muted small">الرجاء إدخال كلمة المرور</p>
                </div>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">كلمة المرور</label>
                        <input type="password" name="password" class="form-control form-control-lg text-center" 
                               placeholder="••••••" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-shield-lock"></i> دخول
                    </button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('index') }}" class="text-muted small">
                        <i class="bi bi-arrow-right"></i> العودة للرئيسية
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
