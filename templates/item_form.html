{% extends "base.html" %}

{% block title %}{{ app_name }} - {% if item %}تعديل صنف{% else %}إضافة صنف{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8 col-xl-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4">
                <h2 class="h4 fw-bold mb-0">
                    <i class="bi bi-{% if item %}pencil{% else %}plus-circle{% endif %} text-primary"></i>
                    {% if item %}تعديل صنف{% else %}إضافة صنف جديد{% endif %}
                </h2>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">رقم الصنف</label>
                            <input type="text" name="item_number" class="form-control" 
                                   value="{{ item.item_number if item else '' }}" required
                                   placeholder="مثال: ZN-001">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">اسم الصنف</label>
                            <input type="text" name="name" class="form-control" 
                                   value="{{ item.name if item else '' }}" required
                                   placeholder="مثال: زنك">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">اللون</label>
                            <input type="text" name="color" class="form-control" 
                                   value="{{ item.color if item else '' }}" required
                                   placeholder="مثال: أبيض">
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">الطول (متر)</label>
                            <input type="number" name="length" class="form-control" step="0.01" 
                                   value="{{ item.length if item else '' }}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">العرض (متر)</label>
                            <input type="number" name="width" class="form-control" step="0.01" 
                                   value="{{ item.width if item else '' }}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">السماكة (مم)</label>
                            <input type="number" name="thickness" class="form-control" step="0.01" 
                                   value="{{ item.thickness if item else '' }}" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold">وزن الحبة (كجم)</label>
                            <input type="number" name="unit_weight" class="form-control" step="0.001" 
                                   value="{{ item.unit_weight if item else '' }}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">ملاحظات</label>
                            <textarea name="notes" class="form-control" rows="2" 
                                      placeholder="ملاحظات إضافية...">{{ item.notes if item else '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg flex-fill">
                            <i class="bi bi-check-lg"></i> {% if item %}حفظ التعديلات{% else %}إضافة الصنف{% endif %}
                        </button>
                        <a href="{{ url_for('items_list') }}" class="btn btn-outline-secondary btn-lg">
                            <i class="bi bi-x-lg"></i> إلغاء
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
