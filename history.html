<!-- templates/history.html -->
{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>📋 سجل العمليات</h2>
    <div class="form-group">
        <input type="text" id="history_search" placeholder="بحث في السجل..." class="search-input" oninput="loadHistory()">
    </div>
    <div id="history_list"></div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', loadHistory);
</script>
{% endblock %}
