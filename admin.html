<!-- templates/admin.html -->
{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>🔧 إدارة الأصناف</h2>
    <button class="btn btn-primary" onclick="showAddItemForm()">➕ إضافة صنف جديد</button>
    <div id="item_form" style="display:none;" class="card">
        <input type="hidden" id="edit_item_id">
        <div class="form-group"><label>رقم الصنف</label><input type="text" id="item_number" class="big-input"></div>
        <div class="form-group"><label>اسم الصنف</label><input type="text" id="item_name" class="big-input"></div>
        <div class="form-group"><label>اللون</label><input type="text" id="item_color" class="big-input"></div>
        <div class="form-group"><label>الطول (متر)</label><input type="number" id="item_length" step="0.01" class="big-input"></div>
        <div class="form-group"><label>العرض (متر)</label><input type="number" id="item_width" step="0.01" class="big-input"></div>
        <div class="form-group"><label>السماكة (ملم)</label><input type="number" id="item_thickness" step="0.01" class="big-input"></div>
        <div class="form-group"><label>وزن الحبة (كجم)</label><input type="number" id="item_unit_weight" step="0.001" class="big-input"></div>
        <div class="form-group"><label>ملاحظة</label><input type="text" id="item_notes" class="big-input"></div>
        <button class="btn btn-primary" onclick="saveItem()">💾 حفظ</button>
        <button class="btn btn-outline" onclick="cancelItemForm()">إلغاء</button>
    </div>
    <div id="items_list" class="table-responsive"></div>
</div>
<div class="card" style="margin-top:20px;">
    <h2>📦 النسخ الاحتياطي</h2>
    <button class="btn btn-secondary" onclick="exportBackup()">⬇️ تصدير نسخة احتياطية (CSV)</button>
    <div class="form-group" style="margin-top:10px;">
        <label>استيراد نسخة احتياطية (ملف CSV)</label>
        <input type="file" id="backup_file" accept=".csv">
        <button class="btn btn-outline" onclick="importBackup()">⬆️ استيراد</button>
    </div>
</div>
<div class="card" style="margin-top:20px;">
    <h2>📝 سجل التعديلات (المعايرة)</h2>
    <div id="calibration_logs"></div>
</div>
<div class="card" style="margin-top:20px;">
    <h2>🔒 تغيير كلمة المرور</h2>
    <div class="form-group">
        <label>كلمة المرور الجديدة</label>
        <input type="password" id="new_password" class="big-input">
        <button class="btn btn-primary" onclick="changePassword()">تحديث</button>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    loadItems();
    loadCalibrationLogs();
});
</script>
{% endblock %}
