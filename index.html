<!-- templates/index.html -->
{% extends "base.html" %}
{% block content %}
<div class="card">
    <h2>🧮 حساب وزن الحمولة</h2>
    <div class="form-group">
        <label for="item_search">اختيار الصنف (بحث سريع)</label>
        <input type="text" id="item_search" placeholder="ابحث بالاسم، اللون، السماكة..." class="search-input">
        <input type="hidden" id="selected_item_id">
        <div id="search_results" class="search-dropdown"></div>
    </div>
    <div id="item_details" class="item-details" style="display:none;">
        <div class="detail-row"><span class="label">اسم الصنف:</span> <span id="d_name"></span></div>
        <div class="detail-row"><span class="label">اللون:</span> <span id="d_color"></span></div>
        <div class="detail-row"><span class="label">الطول:</span> <span id="d_length"></span> متر</div>
        <div class="detail-row"><span class="label">العرض:</span> <span id="d_width"></span> متر</div>
        <div class="detail-row"><span class="label">السماكة:</span> <span id="d_thickness"></span> ملم</div>
        <div class="detail-row highlight"><span class="label">وزن الحبة:</span> <span id="d_unit_weight"></span> كجم</div>
    </div>
    <div class="form-group">
        <label for="quantity">عدد الحبات</label>
        <input type="number" id="quantity" min="1" value="1" class="big-input">
    </div>
    <div class="result-box" id="expected_weight_box">
        <span class="result-label">الوزن المتوقع:</span> <span class="result-value" id="expected_weight_display">--</span> كجم
    </div>
    <div class="form-group">
        <label for="actual_weight">وزن الميزان الفعلي (اختياري)</label>
        <input type="number" id="actual_weight" step="0.01" class="big-input" placeholder="أدخل الوزن الفعلي">
    </div>
    <button class="btn btn-primary full-width" onclick="calculate()">⚖️ حساب ومقارنة</button>
    <div id="comparison_result" style="display:none; margin-top:20px;">
        <div class="card status-card" id="status_card">
            <h3 id="status_text"></h3>
            <div class="comparison-details">
                <div>الفرق: <span id="diff_val"></span> كجم</div>
                <div>نسبة الفرق: <span id="diff_percent"></span>%</div>
                <div id="alert_msg" class="alert-message"></div>
            </div>
        </div>
        <button class="btn btn-outline" id="calibrate_btn" style="display:none;" onclick="calibrateWeight()">📝 تحديث وزن الصنف بناءً على الميزان</button>
    </div>
</div>

<div class="card" style="margin-top:20px;">
    <h2>📐 حاسبة الوزن الهندسية (عند عدم وجود صنف)</h2>
    <div class="form-group">
        <label for="eng_length">الطول (متر)</label>
        <input type="number" id="eng_length" step="0.01" class="big-input" value="6">
    </div>
    <div class="form-group">
        <label for="eng_width">العرض (متر)</label>
        <input type="number" id="eng_width" step="0.01" class="big-input" value="1.05">
    </div>
    <div class="form-group">
        <label for="eng_thickness">السماكة (ملم)</label>
        <input type="number" id="eng_thickness" step="0.01" class="big-input" value="0.35">
    </div>
    <div class="form-group">
        <label for="density">الكثافة (جم/سم³) الافتراضي للزنك 7.14</label>
        <input type="number" id="density" step="0.01" class="big-input" value="7.14">
    </div>
    <button class="btn btn-secondary" onclick="calculateEngineering()">🔢 حساب وزن الحبة</button>
    <div id="eng_result" style="display:none; margin-top:15px;">
        <div class="result-box">
            <span class="result-label">وزن الحبة المتوقع:</span> <span class="result-value" id="eng_unit_weight"></span> كجم
        </div>
        <div class="form-group" style="margin-top:15px;">
            <label for="eng_quantity">عدد الحبات</label>
            <input type="number" id="eng_quantity" min="1" value="1" class="big-input">
        </div>
        <button class="btn btn-primary" onclick="calculateEngLoad()">⚖️ حساب وزن الحمولة</button>
        <div id="eng_load_result" style="display:none; margin-top:10px;" class="result-box">
            <span class="result-label">وزن الحمولة المتوقع:</span> <span class="result-value" id="eng_load_weight"></span> كجم
        </div>
    </div>
</div>
{% endblock %}
